version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ffmpeg-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=2
      - TEMP_DIR=/tmp/ffmpeg-jobs
    volumes:
      - worker_storage:/tmp/ffmpeg-jobs
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  worker_storage:
